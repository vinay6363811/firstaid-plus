<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="320" rx="16" fill="url(#heroBg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left: First Aid Kit & Supplies Illustration -->
  <g transform="translate(60, 40)">
    <!-- Kit Case -->
    <rect x="20" y="70" width="160" height="130" rx="12" fill="#dc2626" filter="url(#cardShadow)"/>
    <!-- Handle -->
    <path d="M 60 70 C 60 45, 140 45, 140 70" fill="none" stroke="#991b1b" stroke-width="12" stroke-linecap="round"/>
    <rect x="20" y="115" width="160" height="8" fill="#991b1b"/>
    <!-- White Cross Emblem -->
    <rect x="85" y="100" width="30" height="70" rx="4" fill="#ffffff"/>
    <rect x="65" y="120" width="70" height="30" rx="4" fill="#ffffff"/>
    <!-- Latches -->
    <rect x="45" y="112" width="14" height="14" rx="2" fill="#f8fafc"/>
    <rect x="141" y="112" width="14" height="14" rx="2" fill="#f8fafc"/>

    <!-- Stethoscope drape -->
    <path d="M 180 180 C 220 220, 240 160, 210 130 C 190 110, 160 140, 170 170" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <circle cx="210" cy="130" r="14" fill="#64748b" stroke="#334155" stroke-width="3"/>
    <circle cx="210" cy="130" r="8" fill="#cbd5e1"/>

    <!-- Bandage roll -->
    <ellipse cx="40" cy="210" rx="28" ry="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="40" cy="206" rx="14" ry="9" fill="#e2e8f0"/>
  </g>

  <!-- Center: Smartphone with FirstAid+ App Screen -->
  <g transform="translate(360, 20)">
    <!-- Phone body -->
    <rect x="0" y="0" width="170" height="280" rx="28" fill="#0f172a" stroke="#334155" stroke-width="4" filter="url(#cardShadow)"/>
    <!-- Inner Screen -->
    <rect x="8" y="12" width="154" height="256" rx="20" fill="url(#phoneScreen)"/>
    <!-- Speaker notch -->
    <rect x="60" y="18" width="50" height="6" rx="3" fill="#334155"/>

    <!-- App Header on Screen -->
    <rect x="18" y="36" width="22" height="22" rx="4" fill="#dc2626"/>
    <text x="23" y="52" fill="#ffffff" font-size="16" font-weight="900" font-family="sans-serif">+</text>
    <text x="46" y="51" fill="#ffffff" font-size="12" font-weight="800" font-family="sans-serif">FirstAid+</text>

    <!-- App SOS Pill -->
    <rect x="18" y="66" width="134" height="24" rx="12" fill="#dc2626"/>
    <text x="85" y="82" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">🚨 EMERGENCY: 112</text>

    <!-- Card on Screen (Analyzer Active) -->
    <rect x="18" y="98" width="134" height="95" rx="8" fill="#ffffff"/>
    <rect x="26" y="106" width="70" height="12" rx="3" fill="#dbeafe"/>
    <text x="29" y="115" fill="#1e40af" font-size="8" font-weight="bold" font-family="sans-serif">SMART TRIAGE</text>
    <circle cx="138" cy="112" r="5" fill="#10b981"/>
    
    <text x="26" y="132" fill="#0f172a" font-size="10" font-weight="800" font-family="sans-serif">Instant Detection</text>
    <text x="26" y="145" fill="#64748b" font-size="8" font-family="sans-serif">✓ Text Description</text>
    <text x="26" y="157" fill="#64748b" font-size="8" font-family="sans-serif">✓ Photo Inspection</text>
    <text x="26" y="169" fill="#64748b" font-size="8" font-family="sans-serif">✓ Spoken Audio Steps</text>
    <rect x="26" y="174" width="118" height="12" rx="3" fill="#1e40af"/>
    <text x="85" y="183" fill="#ffffff" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle">Step-by-Step Guide ▶</text>

    <!-- Pulse ECG Line at bottom of screen -->
    <path d="M 18 225 L 45 225 L 55 205 L 65 245 L 75 215 L 85 230 L 95 225 L 152 225" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="85" y="250" fill="#94a3b8" font-size="8" font-family="sans-serif" text-anchor="middle">100-120 BPM CPR Ready</text>
  </g>

  <!-- Right: Value Proposition Badges & Features -->
  <g transform="translate(580, 45)">
    <!-- Main Headline Tag -->
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="14" y="17" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">✓ 100% Offline Ready</text>

    <text x="0" y="55" fill="#0f172a" font-size="22" font-weight="900" font-family="sans-serif">First Aid When Every</text>
    <text x="0" y="82" fill="#b91c1c" font-size="22" font-weight="900" font-family="sans-serif">Second Counts.</text>

    <text x="0" y="112" fill="#475569" font-size="13" font-family="sans-serif">Designed for students, travelers & families.</text>
    <text x="0" y="128" fill="#475569" font-size="13" font-family="sans-serif">Clear clinical guidance for any emergency.</text>

    <!-- 3 Key Feature Badges -->
    <g transform="translate(0, 145)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <circle cx="16" cy="16" r="16" fill="#eff6ff"/>
        <text x="16" y="21" font-size="14" text-anchor="middle">📸</text>
        <text x="40" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Photo & Text Analyzer</text>
        <text x="40" y="27" fill="#64748b" font-size="11" font-family="sans-serif">Instant injury recognition</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(0, 42)">
        <circle cx="16" cy="16" r="16" fill="#fef2f2"/>
        <text x="16" y="21" font-size="14" text-anchor="middle">🔊</text>
        <text x="40" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Hands-Free Voice Guide</text>
        <text x="40" y="27" fill="#64748b" font-size="11" font-family="sans-serif">Speaks instructions aloud</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(0, 84)">
        <circle cx="16" cy="16" r="16" fill="#fffbeb"/>
        <text x="16" y="21" font-size="14" text-anchor="middle">🚨</text>
        <text x="40" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Speed-Dial 112 & 108</text>
        <text x="40" y="27" fill="#64748b" font-size="11" font-family="sans-serif">One-tap ambulance call in India</text>
      </g>
    </g>
  </g>
</svg>

