<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="100%" height="100%">
  <defs>
    <filter id="stepShadow" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Step 1 Card -->
  <g transform="translate(10, 10)">
    <rect width="250" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stepShadow)"/>
    <circle cx="40" cy="40" r="20" fill="#eff6ff"/>
    <text x="40" y="47" font-size="20" text-anchor="middle">📝</text>
    <rect x="70" y="24" width="60" height="18" rx="4" fill="#dbeafe"/>
    <text x="76" y="37" fill="#1e40af" font-size="10" font-weight="bold" font-family="sans-serif">STEP 01</text>
    <text x="70" y="58" fill="#0f172a" font-size="14" font-weight="bold" font-family="sans-serif">Describe or Snap</text>
    <text x="24" y="90" fill="#475569" font-size="12" font-family="sans-serif">Type symptoms in plain words</text>
    <text x="24" y="108" fill="#475569" font-size="12" font-family="sans-serif">or upload a photo of the burn,</text>
    <text x="24" y="126" fill="#475569" font-size="12" font-family="sans-serif">cut, swelling, or bite.</text>
    <!-- Indicator pill -->
    <rect x="24" y="136" width="120" height="16" rx="3" fill="#f1f5f9"/>
    <text x="30" y="148" fill="#64748b" font-size="9" font-weight="600" font-family="sans-serif">Camera & Text Ready</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(270, 80)">
    <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(295, 10)">
    <rect width="250" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stepShadow)"/>
    <circle cx="40" cy="40" r="20" fill="#fffbeb"/>
    <text x="40" y="47" font-size="20" text-anchor="middle">🔍</text>
    <rect x="70" y="24" width="60" height="18" rx="4" fill="#fef3c7"/>
    <text x="76" y="37" fill="#b45309" font-size="10" font-weight="bold" font-family="sans-serif">STEP 02</text>
    <text x="70" y="58" fill="#0f172a" font-size="14" font-weight="bold" font-family="sans-serif">Instant Severity Triage</text>
    <text x="24" y="90" fill="#475569" font-size="12" font-family="sans-serif">Classifies urgency accurately</text>
    <text x="24" y="108" fill="#475569" font-size="12" font-family="sans-serif">into 4 clinical triage levels:</text>
    <!-- Triage badges -->
    <g transform="translate(24, 120)">
      <rect x="0" y="0" width="46" height="20" rx="4" fill="#f0fdf4" stroke="#86efac"/>
      <text x="23" y="14" fill="#15803d" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">LOW</text>
      <rect x="52" y="0" width="46" height="20" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
      <text x="75" y="14" fill="#b45309" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">MOD</text>
      <rect x="104" y="0" width="46" height="20" rx="4" fill="#fff7ed" stroke="#fdba74"/>
      <text x="127" y="14" fill="#c2410c" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">HIGH</text>
      <rect x="156" y="0" width="46" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="179" y="14" fill="#b91c1c" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">CRIT</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(555, 80)">
    <path d="M 0 10 L 18 10 M 12 4 L 18 10 L 12 16" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(580, 10)">
    <rect width="250" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stepShadow)"/>
    <circle cx="40" cy="40" r="20" fill="#f0fdf4"/>
    <text x="40" y="47" font-size="20" text-anchor="middle">🩺</text>
    <rect x="70" y="24" width="60" height="18" rx="4" fill="#dcfce7"/>
    <text x="76" y="37" fill="#15803d" font-size="10" font-weight="bold" font-family="sans-serif">STEP 03</text>
    <text x="70" y="58" fill="#0f172a" font-size="14" font-weight="bold" font-family="sans-serif">Take Immediate Action</text>
    <text x="24" y="90" fill="#475569" font-size="12" font-family="sans-serif">Numbered first aid steps,</text>
    <text x="24" y="108" fill="#475569" font-size="12" font-family="sans-serif">harmful myths to avoid,</text>
    <text x="24" y="126" fill="#475569" font-size="12" font-family="sans-serif">voice playback & Call 112.</text>
    <rect x="24" y="136" width="130" height="16" rx="3" fill="#fee2e2"/>
    <text x="30" y="148" fill="#991b1b" font-size="9" font-weight="bold" font-family="sans-serif">1-Tap Dial 112 Emergency</text>
  </g>
</svg>

