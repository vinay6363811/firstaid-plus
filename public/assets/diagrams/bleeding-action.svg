<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <filter id="diagShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#diagShadow2)"/>

  <!-- Left: Direct Pressure Diagram -->
  <g transform="translate(30, 25)">
    <!-- Arm outline -->
    <path d="M 10 130 Q 80 120 180 125 L 180 160 Q 80 155 10 165 Z" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>
    <!-- Wound & Blood -->
    <ellipse cx="95" cy="125" rx="14" ry="6" fill="#dc2626"/>
    <!-- Gauze pad -->
    <rect x="70" y="110" width="50" height="20" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Hand pressing down firmly -->
    <g transform="translate(75, 45)">
      <!-- Downward force arrows -->
      <path d="M 20 5 L 20 35 M 12 25 L 20 35 L 28 25" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <!-- Hand outline -->
      <path d="M 5 35 C 5 25, 35 25, 35 35 L 35 65 L 5 65 Z" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>
    </g>

    <!-- Badge -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="90" y="17" fill="#b91c1c" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Firm Continuous Pressure</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="240" y1="20" x2="240" y2="220" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Right: Key Actions -->
  <g transform="translate(260, 25)">
    <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800" font-family="sans-serif">CRITICAL PROTOCOL: SEVERE BLEEDING</text>

    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">1</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Press firmly with sterile gauze or clean cloth</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Maintain firm hand pressure without letting go to peek.</text>
    </g>

    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">2</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">If blood soaks through, add more layers ON TOP</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Never remove the original cloth — doing so strips forming clots.</text>
    </g>

    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">3</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Elevate limb above heart level</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Reduces hydrostatic blood pressure to the laceration.</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#fee2e2"/>
      <text x="9" y="13" fill="#b91c1c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✕</text>
      <text x="26" y="14" fill="#991b1b" font-size="12" font-weight="bold" font-family="sans-serif">DO NOT remove embedded objects (knife/glass)</text>
      <text x="26" y="28" fill="#7f1d1d" font-size="11" font-family="sans-serif">Bulky dressing around object; removing causes fatal bleed.</text>
    </g>
  </g>
</svg>

