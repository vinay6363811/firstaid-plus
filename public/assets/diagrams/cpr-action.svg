<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <filter id="cprDiagShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cprDiagShadow)"/>

  <!-- Left: CPR Hand Position & Compression Vector -->
  <g transform="translate(30, 20)">
    <!-- Victim Chest Outline -->
    <path d="M 20 160 C 50 145, 150 145, 180 160 L 180 190 L 20 190 Z" fill="#e2e8f0"/>
    <ellipse cx="100" cy="155" rx="30" ry="10" fill="#cbd5e1"/>
    <!-- Sternum cross mark -->
    <text x="100" y="160" fill="#dc2626" font-size="16" font-weight="900" font-family="sans-serif" text-anchor="middle">✚</text>

    <!-- Straight arms pressing down at 90 degrees -->
    <g transform="translate(80, 20)">
      <!-- Shoulders over victim -->
      <line x1="20" y1="10" x2="20" y2="90" stroke="#1e40af" stroke-width="12" stroke-linecap="round"/>
      <text x="35" y="55" fill="#1e40af" font-size="11" font-weight="bold" font-family="sans-serif">90° Lock</text>

      <!-- Hands interlocked at center -->
      <ellipse cx="20" cy="100" rx="22" ry="14" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>
      <ellipse cx="20" cy="110" rx="18" ry="10" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>

      <!-- Depth arrows -->
      <path d="M -15 80 L -15 115 M -20 105 L -15 115 L -10 105" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <text x="-25" y="98" fill="#dc2626" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="end">5-6 cm</text>
    </g>

    <!-- Rate Badge -->
    <g transform="translate(10, 185)">
      <rect x="0" y="0" width="180" height="24" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="90" y="16" fill="#991b1b" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">⚡ 100-120 BPM • Hard & Fast</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="240" y1="20" x2="240" y2="220" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Right: CPR Rules -->
  <g transform="translate(260, 25)">
    <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800" font-family="sans-serif">CRITICAL PROTOCOL: CPR COMPRESSIONS</text>

    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">1</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Center of chest between nipples (sternum)</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Heel of one hand, interlock other hand on top.</text>
    </g>

    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">2</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Push down 5 to 6 cm (2 to 2.4 inches)</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Allow chest to recoil fully between each pump.</text>
    </g>

    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">3</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Ratio: 30 Compressions then 2 Breaths</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Or perform continuous Hands-Only CPR if untrained.</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#fee2e2"/>
      <text x="9" y="13" fill="#b91c1c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🚨</text>
      <text x="26" y="14" fill="#991b1b" font-size="12" font-weight="bold" font-family="sans-serif">Put Phone on Speaker & Dial 112</text>
      <text x="26" y="28" fill="#7f1d1d" font-size="11" font-family="sans-serif">Do not stop compressions until medical personnel arrive.</text>
    </g>
  </g>
</svg>

