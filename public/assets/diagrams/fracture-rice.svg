<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <filter id="riceDiagShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#riceDiagShadow)"/>

  <!-- 4 R.I.C.E Blocks -->
  <g transform="translate(15, 20)">
    
    <!-- R: Rest -->
    <g transform="translate(0, 0)">
      <rect width="135" height="195" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <circle cx="67" cy="30" r="16" fill="#1e40af"/>
      <text x="67" y="37" fill="#ffffff" font-size="18" font-weight="900" font-family="sans-serif" text-anchor="middle">R</text>
      <text x="67" y="66" fill="#1e3a8a" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">REST</text>
      <text x="67" y="112" font-size="36" text-anchor="middle">🛑</text>
      <text x="67" y="156" fill="#1e3a8a" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Stop Moving</text>
      <text x="67" y="172" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">Zero weight bearing</text>
    </g>

    <!-- I: Ice -->
    <g transform="translate(145, 0)">
      <rect width="135" height="195" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
      <circle cx="67" cy="30" r="16" fill="#0d9488"/>
      <text x="67" y="37" fill="#ffffff" font-size="18" font-weight="900" font-family="sans-serif" text-anchor="middle">I</text>
      <text x="67" y="66" fill="#115e59" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">ICE</text>
      <text x="67" y="112" font-size="36" text-anchor="middle">🧊</text>
      <text x="67" y="156" fill="#115e59" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">15-20 Min Cold Pack</text>
      <text x="67" y="172" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">Wrap in towel, never bare</text>
    </g>

    <!-- C: Compress -->
    <g transform="translate(290, 0)">
      <rect width="135" height="195" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
      <circle cx="67" cy="30" r="16" fill="#b45309"/>
      <text x="67" y="37" fill="#ffffff" font-size="18" font-weight="900" font-family="sans-serif" text-anchor="middle">C</text>
      <text x="67" y="66" fill="#92400e" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">COMPRESS</text>
      <text x="67" y="112" font-size="36" text-anchor="middle">🩹</text>
      <text x="67" y="156" fill="#92400e" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Elastic Bandage</text>
      <text x="67" y="172" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">Snug, not circulation tight</text>
    </g>

    <!-- E: Elevate -->
    <g transform="translate(435, 0)">
      <rect width="135" height="195" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <circle cx="67" cy="30" r="16" fill="#15803d"/>
      <text x="67" y="37" fill="#ffffff" font-size="18" font-weight="900" font-family="sans-serif" text-anchor="middle">E</text>
      <text x="67" y="66" fill="#166534" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">ELEVATE</text>
      <text x="67" y="112" font-size="36" text-anchor="middle">📐</text>
      <text x="67" y="156" fill="#166534" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Above Heart Level</text>
      <text x="67" y="172" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">Drains painful swelling</text>
    </g>

  </g>
</svg>

