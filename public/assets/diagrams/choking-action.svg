<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <filter id="chokeDiagShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#chokeDiagShadow)"/>

  <!-- Left: Heimlich Maneuver Position -->
  <g transform="translate(30, 20)">
    <!-- Victim standing, leaning slightly forward -->
    <circle cx="85" cy="35" r="16" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>
    <path d="M 75 52 L 65 140 L 95 140 L 95 52 Z" fill="#cbd5e1"/>

    <!-- Rescuer behind -->
    <circle cx="130" cy="30" r="16" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>
    <path d="M 115 48 L 110 140 L 140 140 L 145 48 Z" fill="#1e40af"/>

    <!-- Rescuer arms wrapped around waist -->
    <path d="M 120 70 C 95 65, 60 75, 60 90 C 60 100, 90 95, 115 90" fill="none" stroke="#fbd0a0" stroke-width="10" stroke-linecap="round"/>

    <!-- Thrust vector: Upward & Inward Arrow -->
    <path d="M 50 115 L 75 80 M 60 80 L 75 80 L 75 95" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="35" y="130" fill="#dc2626" font-size="10" font-weight="bold" font-family="sans-serif">In &amp; Up</text>

    <!-- Badge -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#fffbeb" stroke="#fcd34d"/>
      <text x="90" y="17" fill="#b45309" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">5 Back Blows + 5 Thrusts</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="240" y1="20" x2="240" y2="220" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Right: Protocol Rules -->
  <g transform="translate(260, 25)">
    <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800" font-family="sans-serif">CRITICAL PROTOCOL: CHOKING (ADULT/CHILD)</text>

    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">1</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Encourage coughing first if they can make sounds</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Forceful coughing is the body's natural airway clearance.</text>
    </g>

    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">2</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">5 BACK BLOWS: Heel of hand between shoulder blades</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Lean the person well forward so dislodged object falls out.</text>
    </g>

    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">3</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">5 ABDOMINAL THRUSTS: Fist just above navel</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Pull sharply inward and upward. Alternate with back blows.</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#fee2e2"/>
      <text x="9" y="13" fill="#b91c1c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✕</text>
      <text x="26" y="14" fill="#991b1b" font-size="12" font-weight="bold" font-family="sans-serif">NO blind finger sweeps in throat</text>
      <text x="26" y="28" fill="#7f1d1d" font-size="11" font-family="sans-serif">Pushes the obstruction deeper into the vocal cords.</text>
    </g>
  </g>
</svg>

