<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <filter id="snakeDiagShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#snakeDiagShadow)"/>

  <!-- Left: Splinted Immobilized Leg Diagram -->
  <g transform="translate(30, 25)">
    <!-- Leg outline -->
    <path d="M 20 120 L 160 120 C 175 120, 185 130, 185 145 L 180 155 L 20 150 Z" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>
    <!-- Bite site (2 dots) -->
    <circle cx="135" cy="130" r="3" fill="#991b1b"/>
    <circle cx="143" cy="132" r="3" fill="#991b1b"/>
    <text x="139" y="120" fill="#dc2626" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">Fang Marks</text>

    <!-- Rigid splint underneath -->
    <rect x="15" y="152" width="170" height="12" rx="3" fill="#92400e" stroke="#78350f" stroke-width="1"/>
    <!-- Crepe bandage ties -->
    <rect x="40" y="115" width="10" height="52" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="90" y="115" width="10" height="52" fill="#ffffff" stroke="#cbd5e1"/>

    <!-- Heart level comparison arrow -->
    <path d="M 20 85 L 180 85" stroke="#94a3b8" stroke-dasharray="3"/>
    <text x="100" y="78" fill="#1e40af" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">Keep BELOW Heart Level</text>

    <!-- Badge -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="90" y="17" fill="#991b1b" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Immobilize • Rush to Hospital</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="240" y1="20" x2="240" y2="220" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Right: Do's and Critical Don'ts -->
  <g transform="translate(260, 25)">
    <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800" font-family="sans-serif">CRITICAL PROTOCOL: SNAKEBITE (INDIA)</text>

    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✓</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Keep casualty 100% STILL and calm</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Muscle movement pumps venom rapidly into the bloodstream.</text>
    </g>

    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">✓</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Rush to nearest ASV-stocked hospital</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Polyvalent Anti-Snake Venom is the ONLY definitive treatment.</text>
    </g>

    <!-- Fatal myths -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#fee2e2"/>
      <text x="9" y="13" fill="#b91c1c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✕</text>
      <text x="26" y="14" fill="#991b1b" font-size="12" font-weight="bold" font-family="sans-serif">DO NOT CUT the bite wound or SUCK venom</text>
      <text x="26" y="28" fill="#7f1d1d" font-size="11" font-family="sans-serif">Cutting severs nerves; sucking poisons the rescuer.</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#fee2e2"/>
      <text x="9" y="13" fill="#b91c1c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✕</text>
      <text x="26" y="14" fill="#991b1b" font-size="12" font-weight="bold" font-family="sans-serif">DO NOT tie tight arterial tourniquets</text>
      <text x="26" y="28" fill="#7f1d1d" font-size="11" font-family="sans-serif">Causes irreversible tissue necrosis and limb amputation.</text>
    </g>
  </g>
</svg>

