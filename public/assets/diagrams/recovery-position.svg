<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <filter id="recDiagShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#recDiagShadow)"/>

  <!-- Left: Casual side-lying Recovery diagram -->
  <g transform="translate(30, 30)">
    <!-- Floor line -->
    <line x1="10" y1="160" x2="190" y2="160" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Head supported by hand -->
    <circle cx="50" cy="115" r="16" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>
    <!-- Hand under cheek -->
    <ellipse cx="62" cy="125" rx="8" ry="5" fill="#fbd0a0"/>
    <!-- Torso turned onto side -->
    <path d="M 60 125 Q 95 120 130 135 L 125 155 Q 90 145 60 145 Z" fill="#1e40af"/>
    <!-- Bent top knee propping body -->
    <path d="M 125 135 L 155 125 L 165 160" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Airway open tilt arrow -->
    <path d="M 40 95 C 45 85, 60 85, 65 95 M 65 88 L 65 95 L 58 95" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="52" y="80" fill="#10b981" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">Airway Open</text>

    <!-- Badge -->
    <g transform="translate(10, 175)">
      <rect x="0" y="0" width="180" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="90" y="16" fill="#1e40af" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Side-Lying Recovery Position</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="240" y1="20" x2="240" y2="220" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Right: Protocol Rules -->
  <g transform="translate(260, 25)">
    <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800" font-family="sans-serif">UNCONSCIOUS BUT BREATHING CASUALTY</text>

    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">1</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Prevents tongue from falling back</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Gravitational drainage keeps the trachea clear of vomit & saliva.</text>
    </g>

    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">2</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Bend the top leg at a right angle</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Acts like an anchor so the person cannot roll onto their face.</text>
    </g>

    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">3</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Tilt chin back to maintain open airway</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Place the back of their hand under their cheek for head support.</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#fee2e2"/>
      <text x="9" y="13" fill="#b91c1c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✕</text>
      <text x="26" y="14" fill="#991b1b" font-size="12" font-weight="bold" font-family="sans-serif">DO NOT move if spinal fracture suspected</text>
      <text x="26" y="28" fill="#7f1d1d" font-size="11" font-family="sans-serif">Only roll if airway is compromised by fluids.</text>
    </g>
  </g>
</svg>

