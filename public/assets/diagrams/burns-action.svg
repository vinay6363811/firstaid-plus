<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="burnWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="diagShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#diagShadow)"/>

  <!-- Left: Running Cool Water Action -->
  <g transform="translate(30, 25)">
    <!-- Water Tap -->
    <path d="M 60 10 L 100 10 L 100 35 L 85 35 L 85 45 L 75 45 L 75 35 L 60 35 Z" fill="#64748b"/>
    <circle cx="80" cy="5" r="8" fill="#475569"/>
    <!-- Water Stream -->
    <path d="M 76 45 C 74 90, 65 110, 65 140 C 65 160, 95 160, 95 140 C 95 110, 84 90, 84 45 Z" fill="url(#burnWater)"/>
    <ellipse cx="80" cy="150" rx="20" ry="6" fill="#38bdf8" opacity="0.6"/>

    <!-- Hand under water -->
    <path d="M 160 145 C 130 140, 100 135, 75 140 C 55 145, 45 130, 65 125 C 85 120, 115 125, 140 120 L 160 120 Z" fill="#fbd0a0" stroke="#d99f70" stroke-width="2"/>
    <!-- Burn area redness -->
    <ellipse cx="105" cy="128" rx="18" ry="10" fill="#ef4444" opacity="0.7"/>

    <!-- 20 Minutes Badge -->
    <g transform="translate(20, 175)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd"/>
      <circle cx="16" cy="13" r="8" fill="#1e40af"/>
      <text x="16" y="16" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">⏱</text>
      <text x="32" y="17" fill="#1e40af" font-size="11" font-weight="bold" font-family="sans-serif">Cool 20 Minutes</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="240" y1="20" x2="240" y2="220" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Right: Correct Actions vs Harmful Myths -->
  <g transform="translate(260, 25)">
    <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800" font-family="sans-serif">CRITICAL PROTOCOL: THERMAL BURNS</text>

    <!-- Do List -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✓</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Cool immediately under tap water</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Reduces skin destruction within first 3 hrs.</text>
    </g>

    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#dcfce7"/>
      <text x="9" y="13" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif">✓</text>
      <text x="26" y="14" fill="#0f172a" font-size="12" font-weight="bold" font-family="sans-serif">Remove rings & jewelry before swelling</text>
      <text x="26" y="28" fill="#475569" font-size="11" font-family="sans-serif">Prevents dangerous blood vessel constriction.</text>
    </g>

    <!-- Don't List -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#fee2e2"/>
      <text x="9" y="13" fill="#b91c1c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✕</text>
      <text x="26" y="14" fill="#991b1b" font-size="12" font-weight="bold" font-family="sans-serif">NEVER apply ice, butter, or toothpaste</text>
      <text x="26" y="28" fill="#7f1d1d" font-size="11" font-family="sans-serif">Ice damages healing cells; butter traps heat & causes infection.</text>
    </g>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#fee2e2"/>
      <text x="9" y="13" fill="#b91c1c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">✕</text>
      <text x="26" y="14" fill="#991b1b" font-size="12" font-weight="bold" font-family="sans-serif">DO NOT burst blisters</text>
      <text x="26" y="28" fill="#7f1d1d" font-size="11" font-family="sans-serif">Blisters form a natural sterile biological barrier.</text>
    </g>
  </g>
</svg>

